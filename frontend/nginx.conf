server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin for the app and the API, so nothing in the browser needs to know where the
    # API lives.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
